# Instruction policy for Hermes benchmark runs (Team B artifact), format version 1.
#
# candidate-000 is the baseline: it adds no instructions, so version 0 behaves like
# unmodified Hermes plus the benchmark runner.
#
# FORMAT (assumptions to confirm with B1; see docs/team-b/decision_log.md):
#   rules: a list of at most 30 rules. Each rule has a stable id and text of at most 400 chars.
#   The complete file must stay under 8 KB.
#   The runner injects rule text into Hermes instructions. An empty list injects nothing.
schema_version: 1
rules: []
